[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshgpu-queue"
version = "0.1.0"
description = "A checkpoint-aware GPU job queue for machines you can SSH into"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
sshgpu = "sshgpu_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardbaton"
version = "0.1.1"
description = "GPU job relay for SSH machines with priority and checkpoint resume"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
cardbaton = "cardbaton.cli:main"
sshgpu = "cardbaton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
